<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>mr-dip · mesa</title>
<!-- lib.charts.js se inyecta SOLO al abrir un panel de detalle -->
<style>
  :root{
    --ink:#0b0e14;--panel:#10141d;
    --line:#222939;--line2:#2c3448;
    --text:#cdd6e6;--mut:#6d7a92;--mut2:#49536a;
    --amber:#e5a63c;--steel:#7fa6c9;--up:#3fae7c;--down:#c75146;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--text);font:12px/1.35 var(--mono);
       display:flex;flex-direction:column;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:focus-visible{outline:1px solid var(--amber);outline-offset:1px}
  [hidden]{display:none!important}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-weight:400;color:var(--mut2);font-size:10px;padding:0 10px 3px 0}
  td{padding:1px 10px 1px 0;font-size:11px;white-space:nowrap;vertical-align:top;
     font-variant-numeric:tabular-nums}
  .buy{color:var(--up)} .sell{color:var(--down)}
  .up{color:var(--up)} .dn{color:var(--down)}
  .cv{color:var(--mut)} .empty{color:var(--mut2)}

  /* ---- rail de cabecera (~40 px) ---- */
  header{flex:none;height:40px;display:flex;align-items:center;gap:12px;
         padding:0 12px;border-bottom:1px solid var(--line)}
  .brand{font-size:13px;font-weight:700;white-space:nowrap}
  .brand i{color:var(--amber);font-style:normal}
  #conn{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--mut);white-space:nowrap}
  #conn .dot{width:7px;height:7px;border-radius:50%;background:var(--down)}
  #conn.on .dot{background:var(--up)}
  #pills{display:flex;gap:5px}
  .pill{font-size:10px;color:var(--mut);border:1px solid var(--line2);
        padding:1px 6px;border-radius:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .pill.ok{color:var(--up);border-color:#2c4a3d}
  .pill.warn{color:var(--amber);border-color:#57431f}
  .pill.bad{color:var(--down);border-color:#5a2d28}
  #champ{font-size:10px;color:var(--mut);border:1px solid var(--line);padding:1px 7px;
         border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
         max-width:230px}
  .spacer{flex:1}
  #totpnl{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
  #totpnl .l{font-size:10px;color:var(--mut)}
  #totpnl .v{font-size:15px;font-variant-numeric:tabular-nums}
  #clock{font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---- cinta de precios de venues de datos (máx 2 filas) ---- */
  #ticker{flex:none;max-height:40px;display:flex;flex-wrap:wrap;gap:1px 14px;
          overflow:hidden;padding:3px 12px;border-bottom:1px solid var(--line);
          align-content:flex-start}
  .tk{font-size:10.5px;line-height:16px;height:16px;white-space:nowrap;display:inline-flex;gap:6px;
      font-variant-numeric:tabular-nums;padding:1px 3px;border-radius:2px}
  .tk b{font-weight:400;color:var(--mut)}
  .tk i{font-style:normal;color:var(--text)}
  .tk.f-up{background:color-mix(in srgb,var(--up) 12%,transparent)}
  .tk.f-up i{color:var(--up)}
  .tk.f-dn{background:color-mix(in srgb,var(--down) 12%,transparent)}
  .tk.f-dn i{color:var(--down)}
  #ticker .idle{font-size:10.5px;color:var(--mut2)}

  /* ---- mosaico de venues operadas (~180×90 por tile) ---- */
  #mosaic{flex:1;min-height:0;position:relative;border-bottom:1px solid var(--line)}
  #tiles{position:absolute;inset:0;display:grid;gap:1px;background:var(--line);
         grid-template-columns:repeat(var(--cols,9),1fr);
         grid-auto-rows:minmax(0,1fr);overflow:hidden}
  .tile{background:var(--ink);min-width:0;min-height:0;display:flex;flex-direction:column;
        padding:4px 8px 3px;cursor:pointer;overflow:hidden}
  .tile:hover{background:var(--panel)}
  .tl{display:flex;align-items:center;gap:6px;flex:none}
  .tl .name{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;
            text-overflow:ellipsis}
  .st{flex:none;margin-left:auto;font-size:9px;padding:0 5px;border:1px solid var(--line2);
      border-radius:2px;color:var(--mut);letter-spacing:.05em}
  .st.long{color:var(--up);border-color:var(--up)}
  .st.short{color:var(--down);border-color:var(--down)}
  .st.kill{color:var(--ink);border-color:var(--down);background:var(--down)}
  .tm{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:2px}
  .tm .px{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tm .pnl{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sbox{flex:1;min-height:20px;position:relative;margin:3px 0}
  .spark{position:absolute;inset:0;width:100%;height:100%}
  .smsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        font-size:10px;color:var(--mut2);border:1px dashed var(--line);pointer-events:none}
  .tf{flex:none;display:flex;justify-content:space-between;gap:8px;font-size:9.5px;color:var(--mut);
      font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
  .tf .inst{color:var(--mut2);overflow:hidden;text-overflow:ellipsis}
  .tf .pos.p-p{color:var(--up)} .tf .pos.p-n{color:var(--down)}

  /* ---- panel de detalle (uno solo, tapa el mosaico) ---- */
  #detail{position:absolute;inset:0;z-index:3;background:var(--ink);
          display:flex;flex-direction:column}
  .dhead{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;
         border-bottom:1px solid var(--line)}
  #dname{font-size:13px;font-weight:700;white-space:nowrap}
  #dinst{font-size:10.5px;color:var(--mut);white-space:nowrap}
  #dflat{font-size:10.5px;font-weight:600;color:var(--down);border:1px solid var(--down);
         padding:2px 10px;border-radius:2px;white-space:nowrap;margin-left:auto;
         background:color-mix(in srgb,var(--down) 10%,transparent)}
  #dflat.armed{background:var(--down);color:var(--ink)}
  #dflat:disabled{opacity:.5;cursor:default}
  #dclose{font-size:11px;color:var(--mut);border:1px solid var(--line2);padding:2px 9px;
          border-radius:2px;white-space:nowrap}
  #dclose:hover{color:var(--text)}
  #dmsg{font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;
        text-overflow:ellipsis;max-width:280px}
  #dchart{flex:1;min-height:60px;position:relative}
  #dchart .c{position:absolute;inset:0}
  #dchartmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
             color:var(--mut2);font-size:11px;pointer-events:none}

  /* ---- rail inferior (~150 px): trades + avisos ---- */
  #bottom{flex:none;height:230px;display:grid;grid-template-columns:3fr 1fr;
          gap:1px;background:var(--line)}
  .bt{background:var(--panel);display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .bt h2{flex:none;font-size:10px;font-weight:400;color:var(--mut2);padding:5px 12px 3px;
         border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  .bt .scroll{flex:1;overflow:auto;padding:4px 12px}
  #trades-head th[data-k]{cursor:pointer;user-select:none}
  #trades-head th[data-k]:hover{color:var(--text)}
  .tctl{display:flex;gap:6px;align-items:center}
  .tctl select,.tctl input{font:inherit;font-size:10px;color:var(--text);background:var(--ink);
       border:1px solid var(--line2);padding:0 4px;height:16px;border-radius:2px}
  .tctl input{width:90px}
  .tctl button{font-size:10px;border:1px solid var(--line2);padding:0 5px;height:16px;border-radius:2px}
  #tp-info{font-variant-numeric:tabular-nums}
  td.why{color:var(--mut);max-width:220px;overflow:hidden;text-overflow:ellipsis}
  #notices{list-style:none}
  #notices li{font-size:10.5px;padding:1px 0;display:flex;gap:8px;white-space:nowrap;
              overflow:hidden}
  #notices time{color:var(--mut2);flex:none}
  #notices b{font-weight:400;color:var(--mut);flex:none}
  #notices span{overflow:hidden;text-overflow:ellipsis}
  #notices .n-error span,#notices .n-kill span{color:var(--down)}
  .scroll::-webkit-scrollbar{width:8px;height:8px}
  .scroll::-webkit-scrollbar-thumb{background:var(--line2)}
  .scroll::-webkit-scrollbar-track{background:transparent}

  /* ---- responsive: < 1100 px la página scrollea, tiles auto-fill ---- */
  @media (max-width:1100px){
    body{overflow:auto;height:auto;min-height:100%}
    header{height:auto;flex-wrap:wrap;padding:6px 12px;row-gap:6px}
    #champ{max-width:100%}
    #mosaic{flex:none}
    #tiles{position:static;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))!important;
           grid-auto-rows:150px}
    #detail{position:fixed}
    #bottom{height:auto;grid-template-columns:1fr}
    .bt{max-height:320px}
    .bt h2{flex-wrap:wrap}
    .tctl{flex-wrap:wrap}
    .bt .scroll table{min-width:560px}
  }
  @media (max-width:520px){
    #tiles{grid-template-columns:repeat(2,1fr)!important;grid-auto-rows:140px}
    #pills .pill{font-size:9px}
    .tm .px{font-size:14px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">mr-dip<i>/</i>mesa</div>
  <div id="conn"><span class="dot"></span><span id="conn-t">conectando</span></div>
  <div id="pills">
    <span class="pill" id="pill-feed">feed —</span>
    <span class="pill" id="pill-bar">velas —</span>
    <span class="pill" id="pill-brain">cerebro —</span>
  </div>
  <div id="champ" title="champion.edn">champion: swing-grid · thr 2.2</div>
  <div class="spacer"></div>
  <div id="totpnl"><span class="l">neto total $</span><span class="v" id="totpnl-v">—</span></div>
  <div id="clock">--:--:--</div>
</header>

<section id="ticker" aria-label="venues de datos"></section>

<section id="mosaic" aria-label="venues operadas">
  <div id="tiles"></div>
  <div id="detail" hidden>
    <div class="dhead">
      <span id="dname">—</span>
      <span id="dinst"></span>
      <span class="st" id="dst">flat</span>
      <span id="dpos" style="font-size:11px;font-variant-numeric:tabular-nums">pos —</span>
      <span id="dpnl" style="font-size:11px;font-variant-numeric:tabular-nums">P&amp;L —</span>
      <span id="dz" style="font-size:11px;color:var(--mut)">z —</span>
      <span id="dmsg"></span>
      <button id="dflat" type="button">aplanar</button>
      <button id="dclose" type="button" title="cerrar (Esc)">cerrar ✕</button>
    </div>
    <div id="dchart"><div class="c"></div><div id="dchartmsg"></div></div>
  </div>
</section>

<section id="bottom">
  <div class="bt" id="bt-trades">
    <h2><span>operaciones <span id="tsum"></span></span>
      <span class="tctl">
        <select id="tf-venue" aria-label="filtrar venue"><option value="">todas</option></select>
        <button type="button" id="tf-side" data-s="">lado: todos</button>
        <button type="button" id="tp-prev" aria-label="anterior">‹</button>
        <span id="tp-info">0/0</span>
        <button type="button" id="tp-next" aria-label="siguiente">›</button>
      </span></h2>
    <div class="scroll">
      <table style="table-layout:fixed">
        <colgroup><col style="width:70px"><col style="width:110px"><col style="width:50px"><col style="width:80px"><col style="width:95px"><col style="width:95px"><col style="width:60px"><col style="width:70px"><col style="width:80px"></colgroup>
        <thead><tr id="trades-head"><th data-k="ts">cierre ▾</th><th data-k="venue">venue</th><th data-k="side">lado</th><th data-k="qty">qty</th><th data-k="entry">entrada</th><th data-k="exit">salida</th><th data-k="dur">dur</th><th data-k="fee">fee $</th><th data-k="net">neto $</th></tr></thead>
        <tbody id="trades-body"><tr><td colspan="9" class="empty">sin operaciones aún</td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="bt" id="bt-notices">
    <h2>avisos <span id="counters">0 ev · 0 err</span></h2>
    <div class="scroll"><ul id="notices"><li><span class="empty">sin avisos — todo en orden</span></li></ul></div>
  </div>
</section>

<noscript><div style="padding:20px;color:#c75146">esta mesa requiere JavaScript</div></noscript>

<script>
'use strict';
/* ============ utilidades ============ */
const $ = id => document.getElementById(id);
const UP = '#3fae7c', DN = '#c75146', AMBER = '#e5a63c';

const fmtPx = v => {
  if (!isFinite(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1000) return v.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:2});
  return a >= 10 ? v.toFixed(2) : v.toFixed(4);
};
const fmtQ = v => isFinite(+v) ? ((+v > 0 ? '+' : '') + (+v).toFixed(4)) : '—';
const fmtPnl = v => v != null && isFinite(+v) ? ((+v >= 0 ? '+' : '') + (+v).toFixed(2)) : '—';
/* verde ganó, rojo perdió, gris sin operar o a cero */
const pnlCls = v => v == null || !isFinite(v) || Math.abs(v) < 0.005 ? 'cv' : v > 0 ? 'up' : 'dn';
/* ts llega en ns (cerebro), µs (barras), ms (sqlite/alpaca) o s. Devuelve ms,
   o null si es veneno (fuera de rango: jamás alimentar velas con eso). */
const TS_MAX_MS = 1e12 * 10;                 // año 2286: más allá es veneno
function toMs(ts){
  ts = +ts;
  if (!isFinite(ts) || ts <= 0) return null;
  let ms;
  if (ts > 1e17) ms = ts / 1e6;              // nanosegundos
  else if (ts > 1e14) ms = ts / 1e3;         // microsegundos
  else if (ts < 1e11) ms = ts * 1e3;         // segundos
  else ms = ts;                              // milisegundos
  return (ms > 0 && ms <= TS_MAX_MS) ? ms : null;
}
const hhmmss = ms => ms ? new Date(ms).toTimeString().slice(0, 8) : '--:--:--';

/* anillo fijo: cero allocations tras el arranque */
function mkRing(n){ return {a: new Float64Array(n), n: 0, i: 0}; }
function ringPush(r, v){
  r.a[r.i] = v;
  r.i = (r.i + 1) % r.a.length;
  if (r.n < r.a.length) r.n++;
}

/* ============ estado global ============ */
const SPARK_N = 120, CANDLE_CAP = 1200, TARGET_CAP = 1200;
const PAGE = 50, NOTICES_MAX = 8, TICKER_MAX = 32;
const venues = new Map();        // id -> V (venues OPERADAS, una por tile)
const tileByKey = new Map();     // "hl:btc" -> V  (routing de prints)
const ticker = new Map();        // "okx:btc-usdt" -> entry (venues de datos)
const notices = [];              // avisos en buffer (pintado en el beat)
const pending = new Map();       // id -> [eventos] de venues aún sin tile
let events = 0, errors = 0, pendingTotal = 0;
let tradesDirty = false, noticesDirty = false, lastTradeDraw = 0;
let detailV = null, detailChart = null;

/* alias id-base -> feed tag (medido en feeds.py: cbse feedea coinbase,
   krkn feedea kraken; el resto coincide) */
const VENUE_ALIAS = {cbse:'coinbase', krkn:'kraken'};

/* ============ venues operadas: tiles ============ */
function matchKeys(V){
  if (!/-v$/.test(V.id)) return [V.id];          // grvt (prints sin tag), alpaca
  const seg = V.id.split('-')[0];
  const base = VENUE_ALIAS[seg] || seg;
  const inst = String(V.instrument || '').toLowerCase();
  return inst ? [base + ':' + inst] : [];
}

function register(v){
  if (!v || !v.id) return;
  const isTraded = /-v$/.test(v.id) || v.id === 'grvt' || v.id === 'alpaca';
  if (!isTraded) return;                          // venue de datos: solo cinta
  let V = venues.get(v.id);
  if (!V){
    V = {
      id: v.id, label: v.label || v.id, instrument: v.instrument || '',
      pos: +v.position || 0, posLive: null, target: null, kill: false,
      px: null, fold: null, foldDirty: false, net: null, orders: 0, fee: '',
      z: null, spr: null, lastBarAt: 0,
      spark: mkRing(SPARK_N), sparkDirty: false,
      candles: [], targets: [], dirty: false,
      el: {}, _w: {},  // _w: últimos textos escritos (guardia de cambio)
    };
    venues.set(v.id, V);
    buildTile(V);
    layoutGrid();
  } else {
    if (v.label && V.label !== v.label){ V.label = v.label; if (V.el.name){ V.el.name.textContent = V.label; V.el.name.title = V.label; } }
    if (v.instrument && V.instrument !== v.instrument){
      V.instrument = v.instrument;
      if (V.el.inst){ V.el.inst.textContent = V.instrument; V.el.inst.title = V.instrument; }
    }
    if (v.position != null){ V.pos = +v.position || 0; }
  }
  /* VERDAD BACKEND: P&L neto persistido (realized + unrealized, fees dentro) */
  V.net = v.unrealized != null && isFinite(+v.unrealized) ? +v.unrealized : null;
  V.orders = +v.orders || 0;
  V.fee = v.fee_bps != null && isFinite(+v.fee_bps) ? (+v.fee_bps).toFixed(1) + 'bp' : '';
  if (V.keys) for (const k of V.keys) if (tileByKey.get(k) === V) tileByKey.delete(k);
  V.keys = matchKeys(V);
  for (const k of V.keys){
    tileByKey.set(k, V);
    ticker.delete(k);          // si el tag estaba en la cinta, ya tiene tile
  }
  /* drenar eventos llegados antes de que /api/venues registrara el tile
     (el replay del WS arranca antes que el primer poll REST) */
  const buf = pending.get(V.id);
  if (buf){
    pending.delete(V.id); pendingTotal -= buf.length;
    for (const ev of buf) applyBar(V, ev, false);
  }
}

function layoutGrid(){
  const n = venues.size; if (!n) return;
  const box = $('tiles'), W = box.clientWidth || 1, H = box.clientHeight || 1;
  let best = null;
  for (let c = 1; c <= n; c++){
    const rows = Math.ceil(n / c), empty = rows * c - n;
    const asp = (W / c) / (H / rows);                 // ancho/alto del tile
    if (W / c < 150 || H / rows < 110) continue;
    const cost = empty * 4 + Math.abs(Math.log(asp / 1.1));
    if (!best || cost < best.cost) best = {c, rows, cost};
  }
  if (!best) best = {c: Math.ceil(n / Math.max(1, Math.floor(H / 110))), rows: Math.max(1, Math.floor(H / 110))};
  box.style.setProperty('--cols', best.c);
}
/* el alto útil cambia también cuando la cinta o la cabecera se pliegan */
new ResizeObserver(layoutGrid).observe($('tiles'));

function buildTile(V){
  const t = document.createElement('article');
  t.className = 'tile'; t.dataset.v = V.id;
  t.title = V.label + ' — ver detalle';
  t.innerHTML =
    '<div class="tl"><span class="name"></span><span class="st">flat</span></div>' +
    '<div class="tm"><span class="px">—</span><span class="pnl">—</span></div>' +
    '<div class="sbox"><canvas class="spark"></canvas><div class="smsg">esperando prints del venue…</div></div>' +
    '<div class="tf"><span class="pos">pos —</span><span class="z">z —</span><span class="spr"></span></div>' +
    '<div class="tf"><span class="inst"></span><span class="fee"></span></div>';
  $('tiles').appendChild(t);
  V.el = {
    tile: t, name: t.querySelector('.name'), st: t.querySelector('.st'),
    px: t.querySelector('.px'), pnl: t.querySelector('.pnl'),
    cv: t.querySelector('.spark'), inst: t.querySelector('.inst'),
    pos: t.querySelector('.pos'), z: t.querySelector('.z'), spr: t.querySelector('.spr'),
    fee: t.querySelector('.fee'), smsg: t.querySelector('.smsg'),
  };
  V.el.name.textContent = V.label; V.el.name.title = V.label;
  V.el.inst.textContent = V.instrument || '—';
  V.el.inst.title = V.instrument || '';
  V.ctx = V.el.cv.getContext ? V.el.cv.getContext('2d') : null;
}

/* posición visible: la del venue (bar/reconcile) gana sobre la del API */
const posOf = V => V.posLive != null ? V.posLive : V.pos;

function stateOf(V){
  if (V.kill) return 'kill';
  if (V.target != null && isFinite(V.target) && V.target !== 0)
    return V.target > 0 ? 'long' : 'short';
  const p = posOf(V);
  return p > 1e-9 ? 'long' : p < -1e-9 ? 'short' : 'flat';
}

/* ============ cinta de datos (tags "venue:asset") ============ */
function tickerUpdate(tag, px){
  let e = ticker.get(tag);
  if (!e){
    if (ticker.size >= TICKER_MAX){
      const first = ticker.keys().next().value;
      const old = ticker.get(first);
      if (old && old.el) old.el.remove();
      ticker.delete(first);
    }
    const el = document.createElement('span');
    el.className = 'tk';
    el.innerHTML = '<b></b><i>—</i>';
    el.querySelector('b').textContent = tag;
    $('ticker').appendChild(el);
    e = {el, pxEl: el.querySelector('i'), px: null, dir: 0, flash: 0, wpx: null, wcls: ''};
    ticker.set(tag, e);
  }
  if (e.px != null) e.dir = px > e.px ? 1 : px < e.px ? -1 : e.dir;
  e.px = px;
  e.flash = performance.now() + 600;
}

/* ============ sparkline: polyline canvas 2D, ≤1 redraw/s ============ */
function drawSpark(V){
  const cv = V.el.cv; if (!cv || !V.ctx) return;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (w < 12 || h < 8) return;
  const dpr = window.devicePixelRatio || 1;
  const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
  if (cv.width !== pw || cv.height !== ph){ cv.width = pw; cv.height = ph; }
  const g = V.ctx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const r = V.spark, n = r.n;
  if (n < 2) return;
  const len = r.a.length, start = (r.i - n + len) % len;
  let min = Infinity, max = -Infinity;
  for (let k = 0; k < n; k++){
    const v = r.a[(start + k) % len];
    if (v < min) min = v;
    if (v > max) max = v;
  }
  const floor = Math.abs(max) * 3e-4;                  // 3 bp: el ruido de tick no es señal
  if (max - min < floor){ const m = (max + min) / 2; min = m - floor / 2; max = m + floor / 2; }
  if (max - min < 1e-9) max = min + 1e-9;
  g.strokeStyle = r.a[(start + n - 1) % len] >= r.a[start] ? UP : DN;
  g.lineWidth = 2;
  g.beginPath();
  const stepX = w / (n - 1);
  for (let k = 0; k < n; k++){
    const v = r.a[(start + k) % len];
    const x = k * stepX, y = 2 + (h - 4) * (1 - (v - min) / (max - min));
    if (k) g.lineTo(x, y); else g.moveTo(x, y);
  }
  g.stroke();
}

/* ============ velas (para el panel de detalle) ============
   Guardias: jamás aceptar un segundo < al último (setData de
   lightweight-charts lanza con series desordenadas y mata el render). */
function addCandle(V, ms, px){
  const sec = Math.floor(ms / 1000);
  const arr = V.candles;
  const last = arr[arr.length - 1];
  if (last && sec < last.time) return null;       // barra vieja: fuera
  if (last && last.time === sec){
    last.close = px;
    if (px > last.high) last.high = px;
    if (px < last.low) last.low = px;
    return last;
  }
  arr.push({time: sec, open: px, high: px, low: px, close: px});
  if (arr.length > CANDLE_CAP) arr.splice(0, 300);
  return arr[arr.length - 1];
}
function addTarget(V, ms, val){
  const sec = Math.floor(ms / 1000);
  const arr = V.targets;
  const last = arr[arr.length - 1];
  if (last && sec < last.time) return null;
  if (last && last.time === sec){ last.value = val; return last; }
  arr.push({time: sec, value: val});
  if (arr.length > TARGET_CAP) arr.splice(0, 300);
  return arr[arr.length - 1];
}

/* ============ barras: un solo camino para 'bar' e 'history' ============ */
function applyBar(V, ev, live){
  V.lastBarAt = Date.now();
  const ms = toMs(ev.ts);              // null => veneno: sin velas ni spark
  if (ev.close != null && isFinite(+ev.close)){
    V.px = +ev.close;
    if (ms != null){
      const c = addCandle(V, ms, +ev.close);
      if (detailV === V && detailChart && c){ try{ detailChart.candles.update(c); }catch(_){} }
    }
  }
  if (ev.target != null && isFinite(+ev.target)){
    V.target = +ev.target;
    if (ms != null){
      const t = addTarget(V, ms, V.target);
      if (detailV === V && detailChart && t){ try{ detailChart.target.update(t); }catch(_){} }
    }
  }
  if (ev.position != null && isFinite(+ev.position)) V.posLive = +ev.position;
  if (ev.z != null && isFinite(+ev.z)) V.z = (+ev.z).toFixed(2);
  if (ev.spread != null && isFinite(+ev.spread)) V.spr = (+ev.spread).toFixed(1) + ' bp';
}

/* eventos de venues aún sin tile (el replay llega antes del primer
   /api/venues): buffer acotado, se drena en register() */
const PENDING_CAP = 700, PENDING_TOTAL = 5000;
function bufferEvt(ev){
  let a = pending.get(ev.venue);
  if (!a){
    if (pendingTotal >= PENDING_TOTAL) return;
    a = []; pending.set(ev.venue, a);
  }
  a.push(ev); pendingTotal++;
  if (a.length > PENDING_CAP){
    pendingTotal -= a.length - PENDING_CAP;
    a.splice(0, a.length - PENDING_CAP);
  }
}

/* ============ manejadores WS (solo escriben estado + flags) ============ */
function onPrint(ev){
  const name = String(ev.venue || '');
  const px = +ev.px;
  if (!isFinite(px)) return;
  const V = tileByKey.get(name.toLowerCase()) || (name.indexOf(':') < 0 ? venues.get(name) : null);
  if (V){
    V.px = px;
    V.fold = px; V.foldDirty = true;          // colapsa a 1 punto/s en el beat
  } else if (name.indexOf(':') >= 0){
    tickerUpdate(name.toLowerCase(), px);
  }
}

function onQuote(ev){
  const V = tileByKey.get(String(ev.venue || '').toLowerCase());
  if (V && isFinite(+ev.bid) && isFinite(+ev.ask) && +ev.ask > +ev.bid && +ev.bid > 0)
    V.spr = (((+ev.ask - +ev.bid) / ((+ev.ask + +ev.bid) / 2)) * 1e4).toFixed(1) + ' bp';
}

function onBar(ev){
  const V = venues.get(ev.venue);
  if (!V){ bufferEvt(ev); return; }
  applyBar(V, ev, true);
}

function onHistory(ev){
  const V = venues.get(ev.venue);
  if (!V){ bufferEvt(ev); return; }
  applyBar(V, ev, false);
}

function onReconcile(ev){
  const V = venues.get(ev.venue);
  if (V && ev['venue-pos'] != null && isFinite(+ev['venue-pos']))
    V.posLive = +ev['venue-pos'];             // el venue es la verdad

function onMetrics(ev){
  /* mtm efímero del cerebro: NO se pinta (la verdad es /api/venues) */
}

function onTick(ev){
  if (isFinite(+ev['relay-age-ms'])) setPillVal('brain', +ev['relay-age-ms'] / 1000);
}

function onNotice(ev, kind){
  if (kind === 'error') errors++;
  if (kind === 'kill'){
    const V = venues.get(ev.venue);
    if (V) V.kill = true;
  }
  notices.unshift({t: Date.now(), venue: String(ev.venue || ''),
                   msg: String(ev.msg || ''), kind});
  if (notices.length > NOTICES_MAX) notices.pop();
  noticesDirty = true;
}

/* ============ WebSocket con reconexión ============ */
let ws = null, wsTimer = null, backoff = 1500;

function markConn(on, txt){
  const c = $('conn');
  c.className = on ? 'on' : '';
  $('conn-t').textContent = txt;
}

function scheduleReconnect(){
  if (wsTimer) return;
  wsTimer = setTimeout(() => { wsTimer = null; connect(); }, backoff);
  backoff = Math.min(Math.round(backoff * 1.6), 10000);
}

function connect(){
  clearTimeout(wsTimer); wsTimer = null;
  try{
    ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host + '/ws');
  }catch(_){ scheduleReconnect(); return; }
  ws.onopen = () => {
    backoff = 1500;
    markConn(true, 'en vivo');
    /* replay limpio de series: sin historia duplicada. Los trades y los
       avisos NO se borran: el antiduplicado absorbe el reenvío. */
    for (const V of venues.values()){
      V.spark = mkRing(SPARK_N); V.candles = []; V.targets = [];
      V.sparkDirty = true; V.fold = null; V.foldDirty = false;
    }
  };
  ws.onclose = () => { markConn(false, 'reconectando…'); scheduleReconnect(); };
  ws.onerror = () => { try{ ws.close(); }catch(_){} };
  ws.onmessage = e => {
    let ev;
    try{ ev = JSON.parse(e.data); }catch(_){ return; }
    if (!ev || typeof ev !== 'object') return;
    events++;
    switch (ev.type){
      case 'print':     onPrint(ev);     break;
      case 'quote':     onQuote(ev);     break;
      case 'bar':       onBar(ev);       break;
      case 'history':   onHistory(ev);   break;
      case 'order':     orderSeen = true;  break;
      case 'reconcile': onReconcile(ev); break;
      case 'metrics':   onMetrics(ev);   break;
      case 'tick':      onTick(ev);      break;
      case 'notice':    onNotice(ev, 'notice'); break;
      case 'error':     onNotice(ev, 'error');  break;
      case 'kill':      onNotice(ev, 'kill');   break;
    }
  };
}

async function pollVenues(){

      for (const v of vs){ known.add(v.id); register(v); }

      }
    }
  }catch(_){}
}

/* copia estrictamente ascendente: setData jamás recibe desorden */
function saneSeries(a){

  return out;
}

/* ============ renders diferidos (solo si cambió el valor) ============ */
function setW(V, key, el, txt){
  if (V._w[key] !== txt){ V._w[key] = txt; if (el) el.textContent = txt; }
}

function paintTile(V){
  const w = V._w, el = V.el;
  /* precio (venue sin dato aún: calentando…) */
  setW(V, 'px', el.px, V.px != null ? fmtPx(V.px) : '—');
  const hasSpark = V.spark.n >= 2;
  if (w.hs !== hasSpark){ w.hs = hasSpark; el.smsg.hidden = hasSpark; }
  /* pnl + color (de los metrics del cerebro) */
  const ptxt = V.orders ? 'neto ' + fmtPnl(V.net) : 'sin operar';
  if (w.pnl !== ptxt){
    w.pnl = ptxt; el.pnl.textContent = ptxt;
    el.pnl.className = 'pnl ' + (V.orders ? pnlCls(V.net) : 'cv');
    el.pnl.title = V.orders + ' órdenes · realized+unrealized persistido, fees incluidas';
  }
  setW(V, 'fee', el.fee, V.fee ? 'fee ' + V.fee : '');
  /* posición + signo (SHORT rojo) */
  const p = posOf(V);
  const postxt = 'pos ' + fmtQ(p);
  if (w.pos !== postxt){
    w.pos = postxt; el.pos.textContent = postxt;
    el.pos.className = 'pos' + (p > 1e-9 ? ' p-p' : p < -1e-9 ? ' p-n' : '');
  }
  /* z, spread */
  setW(V, 'z', el.z, V.z != null ? 'z ' + V.z : 'z —');
  setW(V, 'spr', el.spr, V.spr != null ? V.spr : '');
  /* badge long/short/flat */
  const st = stateOf(V);
  if (w.st !== st){
    w.st = st;
    el.st.textContent = st === 'kill' ? 'kill' : st.toUpperCase();
    el.st.className = 'st' + (st === 'flat' ? '' : ' ' + st);
  }
  /* sparkline: solo si hay dato nuevo (≤1/s por tile) */
  if (V.sparkDirty){ V.sparkDirty = false; drawSpark(V); }
}

/* operaciones (flat→flat) desde /api/roundtrips: el backend agrupa y
   calcula el neto (fees dentro); la UI solo filtra, ordena y pagina */
const tview = {k: 'ts', dir: -1, venue: '', side: '', page: 0};
const tvenues = new Set();
let trips = [];
async function pollTrips(){
  try{
    const a = await (await fetch('/api/roundtrips?n=1000', {cache:'no-store'})).json();
    if (Array.isArray(a)){
      trips = a.map(t => ({
        ts: toMs(t.close_ts || t.open_ts) || 0, open: t.close_ts == null,
        venue: String(t.venue || ''), side: String(t.side || ''),
        qty: +t.qty, entry: t.entry_px, exit: t.exit_px,
        dur: t.close_ts ? (toMs(t.close_ts) - toMs(t.open_ts)) / 1000 : null,
        fee: t.fee, net: t.net,
      }));

    }
  }catch(_){}
}
const fmtDur = s => s == null ? 'abierta' : s < 60 ? Math.round(s) + 's' : s < 3600 ? Math.round(s / 60) + 'm' : (s / 3600).toFixed(1) + 'h';
function paintTrades(t){
  if (!tradesDirty || t - lastTradeDraw < 1000) return;
  tradesDirty = false; lastTradeDraw = t;
  for (const r of trips) if (r.venue && !tvenues.has(r.venue)){
    tvenues.add(r.venue);
    const o = document.createElement('option'); o.value = o.textContent = r.venue;
    $('tf-venue').appendChild(o);
  }
  const rows = trips.filter(r => (!tview.venue || r.venue === tview.venue) &&
    (!tview.side || r.side === tview.side));
  /* resumen del filtro: nº, % ganadoras, neto total */
  let net = 0, won = 0, closed = 0;
  for (const r of rows) if (r.net != null){ closed++; net += r.net; if (r.net > 0) won++; }
  const ts = $('tsum');
  ts.textContent = closed ? closed + ' · ' + Math.round(100 * won / closed) + '% gan · neto ' + fmtPnl(net) : '';
  ts.className = closed ? pnlCls(net) : 'cv';
  const k = tview.k, d = tview.dir;
  rows.sort((x, y) => {
    const a = x[k], b = y[k];
    if (a == null) return 1; if (b == null) return -1;
    return (a < b ? -1 : a > b ? 1 : 0) * d;
  });
  const pages = Math.max(1, Math.ceil(rows.length / PAGE));
  if (tview.page >= pages) tview.page = pages - 1;
  $('tp-info').textContent = (tview.page + 1) + '/' + pages + ' · ' + rows.length;
  const view = rows.slice(tview.page * PAGE, tview.page * PAGE + PAGE);
  const body = $('trades-body');
  if (!view.length){
    body.innerHTML = '<tr><td colspan="9" class="empty">' + (trips.length ? 'sin coincidencias' : 'sin operaciones aún') + '</td></tr>';
    return;
  }
  body.innerHTML = view.map(r =>
    '<tr><td></td><td class="cv"></td><td class="' + (r.side === 'long' ? 'buy' : 'sell') + '"></td>' +
    '<td></td><td></td><td></td><td class="cv"></td><td class="cv"></td><td class="' + pnlCls(r.net) + '"></td></tr>').join('');
  const trs = body.rows;
  for (let i = 0; i < view.length; i++){
    const r = view[i], c = trs[i].cells;
    c[0].textContent = r.open ? '—' : hhmmss(r.ts);
    c[1].textContent = r.venue;
    c[2].textContent = r.side;
    c[3].textContent = isFinite(r.qty) ? r.qty.toFixed(4) : '—';
    c[4].textContent = r.entry != null ? fmtPx(+r.entry) : '—';
    c[5].textContent = r.exit != null ? fmtPx(+r.exit) : '—';
    c[6].textContent = fmtDur(r.dur);
    c[7].textContent = r.fee != null ? (+r.fee).toFixed(2) : '—';
    c[8].textContent = r.net != null ? fmtPnl(r.net) : 'abierta';
  }
}

  setW(V, 'dpos', $('dpos'), 'pos ' + fmtQ(p));
  $('dpos').style.color = p > 1e-9 ? UP : p < -1e-9 ? DN : '';
  setW(V, 'dpnl', $('dpnl'), 'neto ' + fmtPnl(V.net));
  $('dpnl').className = pnlCls(V.net);
  setW(V, 'dz', $('dz'), V.z != null ? 'z ' + V.z : 'z —');
  const st = stateOf(V);
  const dst = $('dst');
  if (dst._t !== st){
    dst._t = st;
    dst.textContent = st === 'kill' ? 'kill' : st.toUpperCase();
    dst.className = 'st' + (st === 'flat' ? '' : ' ' + st);
  }
}

/* ============ bucle ÚNICO: 1 beat/s + rAF ============ */
let lastBeat = 0, lastClock = 0;
function beat(t){
  /* pliegue de prints: 1 punto de sparkline por segundo y venue */
  for (const V of venues.values()){
    /* 1 punto/s SIEMPRE (último precio vivo): misma ventana en todos los tiles */
    V.foldDirty = false;
    if (V.px != null){ ringPush(V.spark, V.px); V.sparkDirty = true; }
  }
  for (const V of venues.values()) paintTile(V);
  paintTicker(t);
  paintPills(t);
  paintNotices();
  paintTrades(t);
  paintDetail();
  /* P&L total */
  let sum = 0, any = false;
  for (const V of venues.values()) if (V.net != null){ sum += V.net; any = true; }
  const tt = any ? fmtPnl(sum) : '—';
  const tv = $('totpnl-v');
  if (tv._t !== tt){
    tv._t = tt; tv.textContent = tt;
    tv.className = 'v ' + (any ? pnlCls(sum) : 'cv');
  }
  /* contadores */
  const ct = events + ' ev · ' + errors + ' err';
  const ce = $('counters');
  if (ce._t !== ct){ ce._t = ct; ce.textContent = ct; }
}

function frame(t){
  if (t - lastBeat >= 1000){ lastBeat = t; beat(t); }
  if (t - lastClock >= 1000){
    lastClock = t;
    $('clock').textContent = new Date().toISOString().slice(11, 19) + ' UTC';
  }
  requestAnimationFrame(frame);
}

/* ============ arranque ============ */
pollVenues();
connect();
pollHealth();
setInterval(pollVenues, 5000);
setInterval(pollHealth, 5000);
pollTrips();
/* refresco: cada 10 s, o 1 s después de un fill nuevo */
let orderSeen = false;
setInterval(() => { if (orderSeen){ orderSeen = false; pollTrips(); } }, 1000);
setInterval(pollTrips, 10000);
requestAnimationFrame(frame);
</script>
